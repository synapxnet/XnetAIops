spring.application.name=aiops-clm-service
server.port=9181

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/XnetAIops?useSSL=false&serverTimezone=UTC&autoReconnect=true&failOverReadOnly=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

mybatis.configuration.map-underscore-to-camel-case=false

logging.level.root=info
logging.level.com.synapxnet=debug
