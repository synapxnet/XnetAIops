spring.application.name=aiops-usr-service
server.port=9185

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/XnetAIops?useSSL=false&serverTimezone=UTC&autoReconnect=true&failOverReadOnly=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# SMS
Spug.url=https://push.spug.cc/send/v3aDVjBzxWjJeX9M
Apps.Name=XnetAIops

mybatis.configuration.map-underscore-to-camel-case=true

logging.level.root=info
logging.level.com.synapxnet=debug
