spring.application.name=aiops-k8s-service
server.port=9186

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/XnetAIops?useSSL=false&serverTimezone=UTC&autoReconnect=true&failOverReadOnly=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

mybatis.configuration.map-underscore-to-camel-case=true

logging.level.root=info
logging.level.com.synapxnet=debug

# AES encryption key for kubeconfig
k8s.encryption.key=${K8S_ENCRYPTION_KEY}

# 独立的终端执行授权，默认拒绝。Independent terminal execution authorization; denied by default.
openxnet.terminal.organization-access-url=${TERMINAL_ORGANIZATION_ACCESS_URL:}
openxnet.terminal.identity-url=${TERMINAL_IDENTITY_URL:}
openxnet.terminal.allowed-origins=${TERMINAL_ALLOWED_ORIGINS:}
openxnet.terminal.execution-grants=${TERMINAL_EXECUTION_GRANTS:[]}
