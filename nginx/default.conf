server {
    listen 80;
    server_name localhost;

    # 内部组织范围校验，业务接口不相信客户端自声明的团队。
    location = /_organization_access {
        internal;
        proxy_pass http://aiops-usr-service:9185/api/usr/organization-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Uid $http_x_tenant_uid;
        proxy_set_header X-Dept-Uid $http_x_dept_uid;
        proxy_set_header X-Team-Uid $http_x_team_uid;
    }

    # 入口文件禁止缓存，确保部署后立即加载最新资源清单。
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /_app.config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 用户登录服务
    location /api/usr/ {
        proxy_pass http://aiops-usr-service:9185/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 集群生命周期管理
    location /api/clm/ {
        auth_request /_organization_access;
        proxy_pass http://aiops-clm-service:9181/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 主机管理
    location /api/hom/ {
        auth_request /_organization_access;
        proxy_pass http://aiops-hom-service:9182/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 服务管理
    location /api/svm/ {
        auth_request /_organization_access;
        proxy_pass http://aiops-svm-service:9183/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 监控告警
    location /api/mon/ {
        auth_request /_organization_access;
        proxy_pass http://aiops-mon-service:9184/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Kubernetes 管理
    location /api/k8s/ {
        auth_request /_organization_access;
        proxy_pass http://aiops-k8s-service:9186/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 仓库管理
    location /api/reg/ {
        auth_request /_organization_access;
        proxy_pass http://aiops-reg-service:9187/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # K8S WebSocket 终端
    location /api/k8s/ws/ {
        proxy_pass http://aiops-k8s-service:9186/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
