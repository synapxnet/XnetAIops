spring.application.name=aiops-svm-service
server.port=9183

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/XnetAIops?useSSL=false&serverTimezone=UTC&autoReconnect=true&failOverReadOnly=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

mybatis.configuration.map-underscore-to-camel-case=true

logging.level.root=info
logging.level.com.synapxnet=debug

# 量化研究运行时仅在后端容器网络开放，令牌由部署环境注入。
xnet.quantitative.runtime-url=${QUANTITATIVE_RUNTIME_URL:http://quantitative-runtime:8091}
xnet.quantitative.runtime-token=${QUANT_RUNTIME_SERVICE_TOKEN:}
